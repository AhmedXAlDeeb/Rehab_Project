[project]
name = "prosthetics-sim"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "dotenv>=0.9.9",
    "gymnasium>=0.29",
    "imageio>=2.37.3",
    "mujoco>=3.0",
    "numpy>=2.4.4",
    "python-dotenv>=1.2.2",
    "websocket>=0.2.1",
    "websockets>=16.0",
]

[project.scripts]
train = "training.train:main"
render = "viz.render_policy:main"

[dependency-groups]
dev = [
    "jupyter",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["envs", "bridge", "viz"]
